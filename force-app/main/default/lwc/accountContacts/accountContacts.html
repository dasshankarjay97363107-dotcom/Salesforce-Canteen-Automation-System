<template>

    <lightning-card
        title="Account Contacts"
        icon-name="standard:contact">

        <div class="slds-p-around_medium">

            <lightning-button
                label="Get Contacts"
                variant="brand"
                onclick={handleGetContacts}
                disabled={isLoading}>
            </lightning-button>

            <template lwc:if={isLoading}>

                <div class="slds-m-top_medium">

                    <lightning-spinner
                        alternative-text="Loading Contacts">
                    </lightning-spinner>

                </div>

            </template>

            <template lwc:if={showContacts}>

                <div class="slds-m-top_medium">

                    <template lwc:if={contacts.length}>

                        <lightning-datatable
                            key-field="Id"
                            data={contacts}
                            columns={columns}>
                        </lightning-datatable>

                    </template>

                    <template lwc:else>

                        <p>
                            No Contacts found for this Account.
                        </p>

                    </template>

                </div>

            </template>

            <template lwc:if={error}>

                <div class="slds-m-top_medium">

                    <p class="slds-text-color_error">
                        Error while loading Contacts.
                    </p>

                </div>

            </template>

        </div>

    </lightning-card>

</template>
