<template>

    <lightning-card
        title="Account Message Listener"
        icon-name="standard:account">

        <div class="slds-p-around_medium">

            <template lwc:if={selectedAccountId}>

                <p>
                    <strong>Selected Account Id:</strong>
                </p>

                <p class="slds-m-top_small">
                    {selectedAccountId}
                </p>

            </template>

            <template lwc:else>

                <p>
                    Please select an Account from Account Selector.
                </p>

            </template>

        </div>

    </lightning-card>

</template>
