<template>
    <lightning-card tittle=" Employee From">
        <div class="slds-p-around_medium">
            <lightning-input 
            label="Employee Name"
            value={employeeName}
            onchange={handleNameChange}>
            </lightning-input>
            <lightning-input
            label="Employee Salary"
            type="number"
            value={employeeSalary}
            onchange={handleSalaryChange}>
            </lightning-input>
            <lightning-input
            label="employee Email"
            type="email"
            value={employeeEmail}
            onchange={handleEmailChange}>
            </lightning-input>
            <lightning-input
            label="employee phone"
            type="number"
            value={employeePhone}
            onchange={handlePhoneChange}>
            </lightning-input>
        </div>
    </lightning-card>
    
</template>
