<template>
    <lightning-card title={bear.Name} class="bear-tile">

        <div slot="actions">
            <lightning-button-icon
                icon-name="utility:search"
                variant="bare"
                alternative-text="Open record"
                onclick={handleOpenRecordClick}>
            </lightning-button-icon>
        </div>

        <div class="slds-var-p-horizontal_small">
            <div class="slds-media">

                <div class="slds-media__figure">
                    <img
                        src={appResources.bearSilhouette}
                        alt="Bear profile"
                        class="bear-silhouette"
                    />
                </div>

                <div class="slds-media__body">
                    <p>{bear.Sex__c}</p>
                    <p>{bear.Age__c} years old</p>
                    <p>{bear.Height__c} cm</p>
                    <p>{bear.Weight__c} Kg</p>
                </div>

            </div>
        </div>

    </lightning-card>
</template>
