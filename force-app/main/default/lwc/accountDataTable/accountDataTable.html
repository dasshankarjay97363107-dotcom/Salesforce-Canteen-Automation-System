<template>

    <lightning-card
        title="Account List"
        icon-name="standard:account">

        <div class="slds-p-around_medium">

            <template lwc:if={accounts}>

                <lightning-datatable
                    key-field="Id"
                    data={accounts}
                    columns={columns}
                    onrowaction={handleRowAction}>
                </lightning-datatable>

            </template>


            <template lwc:if={error}>

                <p class="slds-text-color_error slds-m-top_medium">
                    Error loading Accounts.
                </p>

            </template>

        </div>

    </lightning-card>

</template>
