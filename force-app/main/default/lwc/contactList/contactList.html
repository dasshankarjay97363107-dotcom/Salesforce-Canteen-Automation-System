<template>

    <lightning-card
        title="Contact List"
        icon-name="standard:contact">

        <div class="slds-p-around_medium">

            <template lwc:if={selectedAccountId}>

                <template lwc:if={contacts.length}>

                    <lightning-datatable
                        key-field="Id"
                        data={contacts}
                        columns={columns}>
                    </lightning-datatable>

                </template>

                <template lwc:else>

                    <p>
                        No Contacts found for selected Account.
                    </p>

                </template>

            </template>

            <template lwc:else>

                <p>
                    Please select an Account.
                </p>

            </template>

        </div>

    </lightning-card>

</template>
