<template>

    <lightning-card
        title="Account Selector"
        icon-name="standard:account">

        <div class="slds-p-around_medium">

            <lightning-combobox
                label="Select Account"
                value={selectedAccountId}
                options={accountOptions}
                onchange={handleAccountChange}>
            </lightning-combobox>

        </div>

    </lightning-card>

</template>
